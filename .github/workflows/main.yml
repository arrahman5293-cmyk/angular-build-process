name: build my angular app

on:
 push:
  branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
       - uses: actions/checkout@v7
       - name: setup node js
         uses: actions/setup-node@v7.1.0
         with: 
           node-version: 22.x
       - name: install dependencies
         run: npn install
       - name: build angular app 
         run: npn run build
       
    

  
