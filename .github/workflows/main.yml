name: build my angular app

on:
 push:
  branches: [ main ]

jobs:
  buil-angular-app:
    runs-on: ubuntu-latest

    steps:
       - uses: actions/checkout@v4.2.0
       - name: Setup Node.js
         uses: actions/setup-node@v4.2.0
         with:
            node-version: 22.x
       - name: Install Dependencies
         run: npm install
       - name: build Angular App 
         run: npm run build
       
    

  
